[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalorie"
version = "0.1.0"
description = "Local Kalshi earnings mention-market research MVP"
readme = "mention-engine-implementation.md"
requires-python = ">=3.11"
dependencies = [
    "defeatbeta-api>=0.0.53",
    "fastapi>=0.115",
    "httpx>=0.27",
    "openai>=2.11",
    "pandas>=2.2",
    "pyarrow>=24.0.0",
    "pdfplumber>=0.11",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.18",
    "rich>=13.7",
    "scikit-learn>=1.5",
    "typer>=0.12",
    "uvicorn>=0.31",
    "yfinance>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "xgboost",
]

[project.scripts]
kalorie = "kalorie.app.cli:app"
kalorie-webapi = "kalorie.webapi.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
