[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalorie2"
version = "0.1.0"
description = "Historical Kalshi mention-market data collector"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-multipart>=0.0.18",
    "typer>=0.12",
    "uvicorn>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[project.scripts]
kalorie2 = "kalorie2.cli:app"
kalorie2-score = "kalorie2.scoring:app"
kalorie2-backtest = "kalorie2.backtest:app"
kalorie2-embedding-patterns = "kalorie2.embedding_patterns:app"
kalorie2-transcript-model = "kalorie2.transcript_model:app"
kalorie2-prediction-engine = "kalorie2.prediction_cli:app"
kalorie2-webapi = "kalorie2.webapi.main:run"
kalorie2-market-poller = "kalorie2.market_poller:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
